services:
  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./apps/api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      API_PORT: 3000
      ANALYTICS_SERVICE_URL: http://analytics:8000
      DATABASE_URL: postgres://retail:retail@postgres:5432/retail_intelligence
      JWT_SECRET: dev-only-retail-intelligence-secret
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://localhost:5173
      INSIGHT_PROVIDER: rule_based
    depends_on:
      - analytics
      - postgres
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  analytics:
    build:
      context: ./services/analytics
    ports:
      - "8000:8000"
    environment:
      MARTS_DIR: /marts
    volumes:
      - ./data/marts:/marts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      POSTGRES_DB: retail_intelligence
    volumes:
      - retail_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  seed:
    image: postgres:16-alpine
    profiles:
      - seed
    environment:
      DATABASE_URL: postgres://retail:retail@postgres:5432/retail_intelligence
    volumes:
      - ./data/marts:/marts:ro
      - ./infra/postgres/schema:/schema:ro
      - ./infra/postgres/seed:/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "/seed/load_marts.sh"]

volumes:
  retail_postgres_data:
