name: Validate Analytics Pipeline

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run analytics build
        run: node scripts/build.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python analysis layer
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas
          PYTHONPATH=python python python/run_all.py
